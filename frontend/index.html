<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rack Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <section class="frame" id="containers" aria-labelledby="containers-title">
      <h2 class="frame-title" id="containers-title">containers</h2>
      <p class="frame-tag" id="containers-count"></p>
      <p class="alert" id="containers-notice" role="status" hidden></p>
      <table class="ctable">
        <colgroup>
          <col class="col-state">
          <col class="col-name">
          <col class="col-id">
          <col class="col-image">
          <col class="col-ports">
          <col class="col-cpu">
          <col class="col-mem">
          <col class="col-net">
          <col class="col-net">
          <col class="col-pids">
          <col class="col-status">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">STATE</th>
            <th scope="col">NAME</th>
            <th scope="col">ID</th>
            <th scope="col">IMAGE</th>
            <th scope="col">PORTS</th>
            <th scope="col">CPU</th>
            <th scope="col">MEM USED/LIMIT</th>
            <th scope="col" class="num">NET RX</th>
            <th scope="col" class="num">NET TX</th>
            <th scope="col" class="num">PIDS</th>
            <th scope="col">STATUS</th>
          </tr>
        </thead>
        <tbody id="containers-body"></tbody>
      </table>
      <p class="empty" id="containers-empty" hidden>-- no containers --</p>
    </section>
  </main>

  <footer class="statusbar" id="link" data-state="connecting">
    <span><span id="spinner">-</span> [<span id="host">?</span>] <span id="link-label">connecting</span></span>
    <time id="clock"></time>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
