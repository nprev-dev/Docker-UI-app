# Runs the tests, and the dashboard itself, on Linux, Windows and macOS.
name: tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: tests, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest Python the package claims to support, and the newest.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  run:
    name: start it, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Installed the way a user gets it, not run from the source folder.
      - run: python -m pip install .
      - name: Start the dashboard and ask it for a reading
        shell: bash
        env:
          # Pings and look-ups are tried for real; the speed test would move 75 MB for nothing.
          DASH_SPEEDTEST_HOURS: "0"
        run: |
          cd "$RUNNER_TEMP"
          rack-dashboard --version
          rack-dashboard --port 8787 > server.log 2>&1 &
          # Every system must be able to read its network and hardware. Docker is only there on some.
          python "$GITHUB_WORKSPACE/tests/smoke.py" http://127.0.0.1:8787 --require network,hardware || { echo "--- server log"; cat server.log; exit 1; }

  install-unix:
    name: install script, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Give this user somewhere to run services of its own (a real machine has that already)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
      - name: Leave a settings file behind, as an earlier install would have
        run: |
          echo "SETTINGS=$HOME/.config/rack-dashboard/env" >> "$GITHUB_ENV"
          mkdir -p ~/.config/rack-dashboard
          # The speed test would move 75 MB for nothing.
          printf '%s\n' '# kept from an earlier install' 'DASH_SPEEDTEST_HOURS=0' > ~/.config/rack-dashboard/env
      - name: The readme's way of passing options
        run: curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh" | sh -s -- --help | grep -e "--lan"
      # Piped from GitHub, exactly as the readme says, but at the commit being tested.
      - name: Install
        run: curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh" | sh -s -- --ref "$GITHUB_SHA"
      - name: Ask what the system started for a reading
        run: python3 tests/smoke.py http://127.0.0.1:8787 --require network,hardware
      - name: Install again over the running one, on another port and open to the network
        run: |
          sh install.sh --ref "$GITHUB_SHA" --port 8790 --lan | tee again.txt
          grep -q "From other machines" again.txt
          grep -q "kept from an earlier install" "$SETTINGS"
          grep -qx "DASH_SPEEDTEST_HOURS=0" "$SETTINGS"
          grep -qx "DASH_PORT=8790" "$SETTINGS"
          grep -qx "DASH_HOST=0.0.0.0" "$SETTINGS"
          if curl -fs http://127.0.0.1:8787/api/snapshot > /dev/null; then echo "still answering on the old port"; exit 1; fi
      - name: Ask it again, where it now listens
        run: python3 tests/smoke.py http://127.0.0.1:8790 --settle 3 --require network,hardware
      - name: Uninstall
        run: |
          sh install.sh --uninstall
          sleep 3
          if curl -fs http://127.0.0.1:8790/api/snapshot > /dev/null; then echo "still running"; exit 1; fi
          test ! -e ~/.local/bin/rack-dashboard
          test ! -e ~/.config/systemd/user/rack-dashboard.service
          test ! -e ~/Library/LaunchAgents/io.github.nprev-dev.rack-dashboard.plist
          test -f "$SETTINGS"
      - name: What it logged
        if: failure()
        run: |
          cat ~/Library/Logs/rack-dashboard.log 2>/dev/null || journalctl --user -u rack-dashboard --no-pager -n 80 || true

  install-windows:
    name: install script, windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Leave a settings file behind, as an earlier install would have
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:APPDATA\rack-dashboard" | Out-Null
          # Written the way Notepad and Windows PowerShell write: with a marker in front of the first line.
          Set-Content -Encoding UTF8 "$env:APPDATA\rack-dashboard\env" "DASH_SPEEDTEST_HOURS=0", "# kept from an earlier install"
      - name: The readme's way of passing options, from the command prompt
        shell: cmd
        run: |
          powershell -ExecutionPolicy ByPass -c "& ([scriptblock]::Create((irm https://raw.githubusercontent.com/%GITHUB_REPOSITORY%/%GITHUB_SHA%/install.ps1))) -Help" | findstr /C:"-Lan"
      # Fetched and run as one piece of text, as the readme says, in the PowerShell every Windows
      # has. The text is that of the commit being tested, told to install that same commit.
      - name: Install
        shell: powershell
        run: |
          $text = Invoke-RestMethod "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"
          $told = $text.Replace('[string]$Ref = "main"', '[string]$Ref = "' + $env:GITHUB_SHA + '"')
          if ($told -eq $text) { throw "the script no longer has the line this test changes" }
          $told | Invoke-Expression
      - name: Ask what was started for a reading
        run: python tests/smoke.py http://127.0.0.1:8787 --require network,hardware
      - name: Install again over the running one, on another port and open to the network, in the newer PowerShell
        shell: pwsh
        run: |
          ./install.ps1 -Ref $env:GITHUB_SHA -Port 8790 -Lan
          $settings = Get-Content "$env:APPDATA\rack-dashboard\env"
          $settings
          foreach ($line in "DASH_SPEEDTEST_HOURS=0", "# kept from an earlier install", "DASH_PORT=8790", "DASH_HOST=0.0.0.0") {
            if ($settings -notcontains $line) { throw "settings file lacks: $line" }
          }
          $entry = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").RackDashboard
          "start-up entry: $entry"
          if ($entry -notlike '"*rack-dashboardw.exe"') { throw "no start-up entry" }
          try { $null = Invoke-WebRequest -TimeoutSec 3 http://127.0.0.1:8787/api/snapshot; $old = $true } catch { $old = $false }
          if ($old) { throw "still answering on the old port" }
      - name: Ask it again, where it now listens
        run: python tests/smoke.py http://127.0.0.1:8790 --settle 3 --require network,hardware
      - name: Uninstall
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw ./install.ps1))) -Uninstall
          Start-Sleep 2
          try { $null = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8790/api/snapshot; $running = $true } catch { $running = $false }
          if ($running) { throw "still running" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").RackDashboard) { throw "start-up entry is still there" }
          if (Test-Path "$HOME\.local\bin\rack-dashboard.exe") { throw "the command is still there" }
          if (-not (Test-Path "$env:APPDATA\rack-dashboard\env")) { throw "the settings were removed" }
      - name: What it logged
        if: always()
        shell: powershell
        run: Get-Content "$env:LOCALAPPDATA\rack-dashboard\rack-dashboard.log" -ErrorAction SilentlyContinue
